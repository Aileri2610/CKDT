<!DOCTYPE html>
<html lang="vi">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
        <title>OCT – Optical Communication Tester</title>
        <style>
            :root {
                --bg: #f4f6f9;
                --fg: #1b1f24;
                --card: #fff;
                --mut: #5c6670;
                --bd: #d9dee4;
                --ac: #0a6cff;
                --ok: #16883f;
                --wa: #c27a00;
                --bad: #d93025;
                --c2: #0a8f8f;
                box-sizing: border-box;
                padding-top: env(safe-area-inset-top,0px);
                padding-bottom: env(safe-area-inset-bottom,0px);
                color-scheme: light
            }

            @media(prefers-color-scheme: dark) {
                :root:not([data-theme="light"]) {
                    --bg:#12151a;
                    --fg: #e6e9ee;
                    --card: #1b2027;
                    --mut: #9aa5b1;
                    --bd: #2f3742;
                    --ac: #5b9bff;
                    --ok: #4cc47a;
                    --wa: #e8a93a;
                    --bad: #ff6b5e;
                    --c2: #3cc6c6;
                    color-scheme: dark
                }
            }

            :root[data-theme="dark"] {
                --bg: #12151a;
                --fg: #e6e9ee;
                --card: #1b2027;
                --mut: #9aa5b1;
                --bd: #2f3742;
                --ac: #5b9bff;
                --ok: #4cc47a;
                --wa: #e8a93a;
                --bad: #ff6b5e;
                --c2: #3cc6c6;
                color-scheme: dark
            }

            html {
                scroll-padding-top: env(safe-area-inset-top,0px)
            }

            * {
                box-sizing: border-box
            }

            body {
                margin: 0;
                background: var(--bg);
                color: var(--fg);
                font: 15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif
            }

            main {
                max-width: 1100px;
                margin: 0 auto;
                padding: 12px
            }

            header {
                display: flex;
                gap: 8px;
                align-items: flex-start;
                justify-content: space-between;
                flex-wrap: wrap
            }

            h1 {
                font-size: 1.4rem;
                margin: 4px 0
            }

            h2 {
                font-size: 1.05rem;
                margin: 0 0 8px
            }

            .sub {
                color: var(--mut);
                margin: 0
            }

            .note {
                background: color-mix(in srgb,var(--wa) 14%,transparent);
                border: 1px solid var(--wa);
                border-radius: 8px;
                padding: 8px 10px;
                margin: 10px 0;
                font-size: .9rem
            }

            .card {
                background: var(--card);
                border: 1px solid var(--bd);
                border-radius: 10px;
                padding: 12px;
                margin: 12px 0
            }

            .g2 {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 12px
            }

            .g2>.card {
                margin: 0
            }

            @media(max-width: 800px) {
                .g2 {
                    grid-template-columns:1fr
                }
            }

            button {
                font: inherit;
                background: var(--card);
                color: var(--fg);
                border: 1px solid var(--bd);
                border-radius: 8px;
                padding: 6px 12px;
                cursor: pointer
            }

            button.p {
                background: var(--ac);
                color: #fff;
                border-color: var(--ac)
            }

            button.sel {
                border-color: var(--ac);
                outline: 2px solid var(--ac)
            }

            .blocks {
                display: grid;
                grid-template-columns: repeat(7,1fr);
                gap: 6px
            }

            .blocks button {
                padding: 8px 2px;
                font-size: .78rem;
                line-height: 1.2
            }

            @media(max-width: 700px) {
                .blocks {
                    grid-template-columns:repeat(2,1fr)
                }
            }

            canvas {
                width: 100%;
                display: block
            }

            .row {
                display: grid;
                grid-template-columns: 1fr auto;
                gap: 2px 8px;
                margin-bottom: 8px
            }

            .row label {
                font-weight: 600
            }

            .row output {
                color: var(--ac);
                font-variant-numeric: tabular-nums
            }

            .row input[type=range] {
                grid-column: 1/3;
                width: 100%
            }

            .btns {
                display: flex;
                gap: 8px;
                flex-wrap: wrap;
                margin-top: 6px
            }

            dl {
                display: grid;
                grid-template-columns: 1fr auto;
                gap: 4px 10px;
                margin: 0
            }

            dt {
                color: var(--mut)
            }

            dd {
                margin: 0;
                font-weight: 600;
                text-align: right;
                font-variant-numeric: tabular-nums
            }

            .sw {
                display: grid;
                grid-template-columns: repeat(3,1fr);
                gap: 8px
            }

            @media(max-width: 800px) {
                .sw {
                    grid-template-columns:1fr
                }
            }

            .sw canvas {
                height: 170px
            }

            .tw {
                overflow-x: auto
            }

            table {
                border-collapse: collapse;
                width: 100%;
                font-size: .88rem
            }

            th,td {
                border-bottom: 1px solid var(--bd);
                padding: 4px 8px;
                text-align: right
            }

            pre {
                background: var(--bg);
                border: 1px solid var(--bd);
                border-radius: 8px;
                padding: 8px;
                overflow-x: auto;
                font-size: .82rem;
                margin: 6px 0
            }

            textarea {
                width: 100%;
                height: 80px;
                background: var(--bg);
                color: var(--fg);
                border: 1px solid var(--bd);
                border-radius: 8px;
                margin-top: 6px;
                display: none
            }

            label.t {
                display: flex;
                gap: 8px;
                align-items: center;
                margin: 6px 0
            }

            .f3 {
                position: relative;
                aspect-ratio: 16/9;
                min-height: 320px;
                border-radius: 8px;
                overflow: hidden;
                background: #05070a
            }

            .f3 canvas {
                width: 100%;
                height: 100%;
                display: block;
                touch-action: none;
                cursor: grab
            }

            #lb {
                position: absolute;
                inset: 0;
                pointer-events: none
            }

            .lb {
                position: absolute;
                left: 0;
                top: 0;
                font-size: 11px;
                padding: 1px 6px;
                border-radius: 10px;
                background: rgba(10,14,20,.78);
                color: #fff;
                white-space: nowrap;
                border: 1px solid rgba(255,255,255,.35)
            }

            .sl3 {
                position: absolute;
                left: 8px;
                bottom: 8px;
                font-size: 12px;
                color: #ffd24a;
                background: rgba(10,14,20,.7);
                border-radius: 6px;
                padding: 0 6px
            }

            .sl3:empty {
                display: none
            }

            #c3:focus-visible {
                outline: 2px solid var(--ac);
                outline-offset: -2px
            }

            .qb {
                position: absolute;
                right: 8px;
                top: 8px;
                width: 28px;
                height: 28px;
                border-radius: 50%;
                padding: 0;
                z-index: 3
            }

            .hp {
                position: absolute;
                right: 8px;
                top: 42px;
                max-width: 300px;
                background: rgba(10,14,20,.92);
                color: #fff;
                font-size: 12px;
                padding: 8px 10px;
                border-radius: 8px;
                z-index: 3
            }

            .hp[hidden] {
                display: none
            }

            .tl {
                position: absolute;
                right: 8px;
                bottom: 8px;
                background: #0b0b0d;
                border-radius: 8px;
                padding: 6px;
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 4px;
                color: #fff;
                font-size: 10px;
                max-width: 90px;
                text-align: center;
                z-index: 2
            }

            .tl span {
                width: 14px;
                height: 14px;
                border-radius: 50%;
                background: #3a3a3a;
                display: block
            }

            @media (orientation: landscape) and (min-width:700px) {
                body {
                    overflow:hidden
                }

                main {
                    display: grid;
                    grid-template-columns: minmax(0,1fr) minmax(0,1fr);
                    gap: 12px;
                    height: 100dvh;
                    max-width: none;
                    margin: 0;
                    padding: calc(8px + env(safe-area-inset-top,0px)) calc(8px + env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) calc(8px + env(safe-area-inset-left,0px))
                }

                #lc {
                    position: sticky;
                    top: 0;
                    height: 100%;
                    display: flex;
                    flex-direction: column;
                    min-height: 0
                }

                #lc .card {
                    margin: 0 0 8px
                }

                #lc #cd {
                    display: block;
                    flex: 0 0 auto;
                    height: 76px!important;
                    min-height: 56px
                }

                #lc>section:first-child {
                    flex: 0 0 auto
                }

                #lc .blocks button {
                    font-size: .68rem;
                    padding: 5px 1px
                }

                #s3d {
                    flex: 1;
                    display: flex;
                    flex-direction: column;
                    min-height: 0;
                    margin: 0!important
                }

                #s3d .f3 {
                    flex: 1;
                    aspect-ratio: auto;
                    min-height: 0
                }

                #rc {
                    overflow-y: auto;
                    height: 100%;
                    min-height: 0;
                    padding-right: 4px
                }
            }

            select {
                font: inherit;
                background: var(--card);
                color: var(--fg);
                border: 1px solid var(--bd);
                border-radius: 6px;
                padding: 3px
            }

            tr.hl {
                background: color-mix(in srgb,var(--wa) 28%,transparent)
            }

            .tip {
                position: absolute;
                pointer-events: none;
                background: rgba(10,14,20,.94);
                color: #fff;
                font-size: 12px;
                padding: 4px 8px;
                border-radius: 6px;
                z-index: 4;
                line-height: 1.4;
                white-space: nowrap
            }

            dialog#dm {
                border: 1px solid var(--bd);
                border-radius: 12px;
                background: var(--card);
                color: var(--fg);
                padding: 0;
                width: min(760px,94vw);
                max-height: 90dvh;
                overflow: hidden
            }

            dialog#dm::backdrop {
                background: rgba(0,0,0,.55)
            }

            .dw {
                display: flex;
                flex-direction: column;
                max-height: 90dvh
            }

            .dh {
                display: flex;
                justify-content: space-between;
                align-items: center;
                padding: 8px 14px;
                border-bottom: 1px solid var(--bd)
            }

            .db {
                padding: 12px 14px;
                overflow-y: auto
            }

            .mc {
                border: 1px solid var(--bd);
                border-radius: 10px;
                padding: 10px;
                margin: 0 0 10px
            }

            .mf {
                font: 1.05rem/1.9 Georgia,'Times New Roman',serif;
                background: var(--bg);
                border-radius: 8px;
                padding: 6px 10px;
                margin: 6px 0;
                overflow-x: auto
            }

            .mf div {
                white-space: nowrap
            }

            .fr {
                display: inline-flex;
                flex-direction: column;
                vertical-align: middle;
                text-align: center;
                margin: 0 3px;
                font-size: .95em
            }

            .fr>span:first-child {
                border-bottom: 1px solid currentColor;
                padding: 0 4px
            }

            .lg {
                color: var(--mut);
                font-size: .82rem;
                margin: 4px 0
            }

            .cv {
                background: color-mix(in srgb,var(--ac) 12%,transparent);
                border-radius: 8px;
                padding: 6px 10px;
                font-size: .88rem
            }

            @media (orientation: landscape) and (max-height:500px) {
                #lc #info {
                    display:-webkit-box;
                    -webkit-line-clamp: 1;
                    -webkit-box-orient: vertical;
                    overflow: hidden
                }
            }

            footer {
                color: var(--mut);
                font-size: .85rem;
                text-align: center;
                padding: 10px 0 20px
            }
        </style>
    </head>

V_off = R·P_amb·Rf                 [V]

                    g.fillText(X.lg ? sf(Math.pow(10, t)) : '' + t, x, h - Bm + 13)
                }
                );
                g.textAlign = 'right';
                (Y.lg ? [0, -3, -6, -9] : nice(ya, yb)).forEach(t => {
                    const y = PY(Y.lg ? Math.pow(10, t) : t);
                    g.strokeStyle = bd;
                    g.beginPath();
                    g.moveTo(Lm, y);
                    g.lineTo(w - Rm, y);
                    g.stroke();
                    g.fillStyle = mu;
                    g.fillText(Y.lg ? '1e' + t : '' + t, Lm - 4, y + 4)
                }
                );
                g.textAlign = 'center';
                g.fillStyle = col('--fg');
                g.fillText(T[X.g], (Lm + w - Rm) / 2, h - 6);
                g.save();
                g.translate(11, (Tm + h - Bm) / 2);
                g.rotate(-Math.PI / 2);
                g.fillText(yk == 'b' ? 'BER' : T.a2, 0, 0);
                g.restore();
                if (TH.length) {
                    g.strokeStyle = col('--wa');
                    g.lineWidth = 2;
                    g.setLineDash([6, 4]);
                    g.beginPath();
                    TH.forEach( (q, i) => {
                        const x = PX(q[0])
                          , y = PY(q[1]);
                        i ? g.lineTo(x, y) : g.moveTo(x, y)
                    }
                    );
                    g.stroke();
                    g.setLineDash([]);
                    g.fillStyle = col('--wa');
                    g.textAlign = 'right';
                    g.fillText('- - ' + T.ths, w - Rm - 4, Tm + 10)
                }
                const pts = rows.map(o => {
                    const yv = Y.f(o.x)
                      , z = yk == 'b' && yv <= 0;
                    return {
                        o,
                        x: PX(tf(Math.max(X.f(o.x), 1e-12))),
                        y: PY(z ? 1e-9 : yv),
                        z
                    }
                }
                ).sort( (u, v) => u.x - v.x);
                if ($('cj').checked && pts.length > 1) {
                    g.strokeStyle = col('--c2');
                    g.lineWidth = 1.5;
                    g.beginPath();
                    pts.forEach( (q, i) => i ? g.lineTo(q.x, q.y) : g.moveTo(q.x, q.y));
                    g.stroke()
                }
                pts.forEach(q => {
                    if (q.o.i === selRow) {
                        g.strokeStyle = col('--wa');
                        g.lineWidth = 3;
                        g.beginPath();
                        g.arc(q.x, q.y, 9, 0, 7);
                        g.stroke()
                    }
                    g.lineWidth = 2;
                    g.beginPath();
                    g.arc(q.x, q.y, 5, 0, 7);
                    if (q.z) {
                        g.fillStyle = col('--card');
                        g.fill();
                        g.strokeStyle = col('--bad');
                        g.stroke()
                    } else {
                        g.fillStyle = col('--ac');
                        g.fill();
                        g.strokeStyle = col('--card');
                        g.stroke()
                    }
                    CH.push({
                        x: q.x,
                        y: q.y,
                        i: q.o.i
                    })
                }
                )
            }
            function chit(e, sel) {
                const cl = $('cl')
                  , tip = $('ctip')
                  , r = cl.getBoundingClientRect()
                  , x = e.clientX - r.left
                  , y = e.clientY - r.top;
                let best = null
                  , bd = 196;
                CH.forEach(c => {
                    const d = (c.x - x) ** 2 + (c.y - y) ** 2;
                    if (d < bd) {
                        bd = d;
                        best = c
                    }
                }
                );
                if (!best) {
                    tip.style.display = 'none';
                    return
                }
                const o = LOG[best.i]
                  , T = L[lang];
                tip.innerHTML = `#${best.i + 1}<br>${T.d2}: ${o.d}<br>${T.r2}: ${o.r}<br>${T.l2}: ${o.l}<br>${T.a2}: ${o.a.toFixed(1)}<br>BER: ${o.b ? o.b.toExponential(2) : '0 (' + T.z0 + ')'}`;
                tip.style.display = 'block';
                tip.style.left = Math.max(0, Math.min(x + 12, r.width - 150)) + 'px';
                tip.style.top = Math.max(0, y - 70) + 'px';
                if (sel) {
                    selRow = best.i;
                    logR();
                    const tr = $('lg').children[best.i];
                    if (tr && tr.scrollIntoView)
                        tr.scrollIntoView({
                            block: 'nearest'
                        })
                }
            }
            $('cl').onpointermove = e => chit(e, false);
            $('cl').onpointerleave = () => {
                $('ctip').style.display = 'none'
            }
            ;
            $('cl').onpointerdown = e => chit(e, true);
            $('cxs').onchange = $('cys').onchange = $('cj').onchange = $('cth').onchange = chart;
            window.hk = () => {
                mdv();
                chart()
            }
            ;
            window.postLang = () => {
                mdBuild();
                selBuild();
                chart()
            }
            ;
            patchL();
            patchL2();
            lang_();
            upd();
            diag();
            init3d2();
        </script>
